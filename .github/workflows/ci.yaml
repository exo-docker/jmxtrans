name: CI

on:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: shellcheck
        run: shellcheck jmxtrans.sh healthcheck.sh test/smoke.sh
      - name: hadolint
        run: docker run --rm -i -v "$PWD/.hadolint.yaml:/.config/hadolint.yaml:ro" hadolint/hadolint < Dockerfile
      - name: Validate JSON configuration
        run: for f in conf/*.json; do python3 -m json.tool "$f" >/dev/null || exit 1; done
      - name: Validate the test stack
        run: docker compose -f test/docker-compose.yml config -q

  smoke:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build image (not pushed)
        run: docker build -t exoplatform/jmxtrans:smoke .
      - name: Smoke test
        run: test/smoke.sh exoplatform/jmxtrans:smoke
