# Test stack: eXo Platform + JMXTrans -> InfluxDB -> Grafana.
# Usage: docker compose -f test/docker-compose.yml up --build
services:
  jmxtrans:
    image: exoplatform/jmxtrans
    build: ..
    restart: on-failure  # jmxtrans exits when eXo's JMX port is not up yet
    environment:
      TARGET_JMX_HOST: exo
      TARGET_HOSTNAME: exo
      TARGET_JMX_PORT: 10001
      TARGET_INFLUXDB_URL: http://influxdb:8086
      JMXTRANS_LOG_LEVEL: DEBUG
      TARGET_INFLUXDB_CREATE_DB: "true"
    volumes:
      - jmxtrans_logs:/var/log/jmxtrans
    depends_on:
      - exo
      - influxdb
  influxdb:
    image: influxdb:1.8-alpine
    volumes:
      - influxdb_data:/var/lib/influxdb
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_PATHS_DATA: /var/lib/grafana
      GF_SERVER_HTTP_PORT: 3000
      # local test stack: browse the provisioned dashboards without logging in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - influxdb
  exo:
    image: exoplatform/exo-community:7.2.2
    ports:
      - "8080:8080"
    environment:
      EXO_DB_TYPE: mysql
      EXO_DB_NAME: exo
      EXO_DB_USER: exo
      EXO_DB_PASSWORD: exo
      EXO_DB_HOST: db
      EXO_ADDONS_LIST: 
      EXO_ES_HOST: search
      EXO_ES_INDEX_REPLICA_NB: "0"  # single search node
      EXO_PROXY_VHOST: localhost
      EXO_PROXY_SSL: "false"
      EXO_JVM_SIZE_MIN: "2g"
      EXO_JVM_SIZE_MAX: "3g"
      EXO_MAIL_SMTP_HOST: "mail"
      EXO_MAIL_SMTP_PORT: "1025"
      EXO_JMX_RMI_REGISTRY_PORT: 10001
      EXO_JMX_RMI_SERVER_PORT: 10002
      EXO_JMX_RMI_SERVER_HOSTNAME: exo
    depends_on:
      - db
      - search
      - mail
    volumes:
      - exo_data:/srv
      - exo_codec:/etc/exo/codec  # keep the codec key: it encrypts data stored in the database
      - exo_logs:/var/log/exo
  search:
    image: elasticsearch:8.14.3
    environment:
      ES_JAVA_OPTS: -Xms512m -Xmx1g
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - search_data:/usr/share/elasticsearch/data
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: my-secret-pw
      MYSQL_DATABASE: exo
      MYSQL_USER: exo
      MYSQL_PASSWORD: exo
    volumes:
      - db_data:/var/lib/mysql:rw
  mail:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
volumes:
  influxdb_data:
  grafana_data:
  exo_data:
  exo_codec:
  exo_logs:
  jmxtrans_logs:
  db_data:
  search_data:
