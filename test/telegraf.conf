[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  flush_interval = "10s"
  flush_jitter = "0s"

# --- Graphite plaintext input from jmxtrans ---
# Metric path: <rootPrefix>.<serverHost>.<serverPort>.<domain>.<resultAlias>.<attr>
# rootPrefix is "jmxtrans.<host>.<node>" so the first 2 segments are host/node tags
[[inputs.graphite]]
  servers = ["0.0.0.0:2003"]
  templates = [
    "jmxtrans.host.node.measurement*"
  ]

# --- Output to InfluxDB v2 ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

# --- Restructure metrics to match original InfluxDB v1 data model ---
# The graphite measurement name is the full path after host/node segments,
# e.g.: "exo.10001.java.lang.jvm_system.SystemLoadAverage"
#
# We transform:
#   Before: measurement="exo.10001.java.lang.jvm_system.SystemLoadAverage"  fields={value:0.75}
#   After:  measurement="jvm_system"  fields={SystemLoadAverage:0.75}
[[processors.starlark]]
  source = '''
def apply(metric):
    parts = metric.name.split(".")
    count = len(parts)
    if count >= 2:
        # Last segment is the attribute name (e.g. "SystemLoadAverage")
        # Second-to-last is the result alias (e.g. "jvm_system")
        field_name = parts[count - 1]
        measurement_name = parts[count - 2]

        metric.name = measurement_name

        # Move value from generic "value" field to the actual attribute name
        if "value" in metric.fields:
            v = metric.fields["value"]
            metric.fields.pop("value")
            metric.fields[field_name] = v

    return metric
'''
