[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"

# --- Graphite plaintext input from jmxtrans ---
# Metric path format produced by jmxtrans GraphiteWriter:
#   <rootPrefix>.servers.<obj_domain>.<typeNames>.<resultAlias>.<attr>
#
# Example with rootPrefix="jmxtrans.exohost.NC":
#   jmxtrans.exohost.NC.servers.java.lang_type=OperatingSystem.className.jvm_system.SystemLoadAverage 0.75 1590000000
#
# Template extracts first two segments (host, node) as InfluxDB tags,
# remaining path becomes the measurement name
[[inputs.graphite]]
  servers = ["0.0.0.0:2003"]
  templates = [
    "jmxtrans.host.node.measurement*"
  ]

# --- InfluxDB v2 output ---
[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
